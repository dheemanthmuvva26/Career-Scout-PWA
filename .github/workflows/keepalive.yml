name: Keep Render Alive

on:
  schedule:
    # Best-effort only: GitHub's free scheduler ran this every 2-5h, not every
    # 10 min, and stopped entirely for weeks (Oct 26 - Nov 24, 2026). The
    # reliable Supabase keepalive is the daily Vercel Cron (pwa/vercel.json ->
    # /api/keepalive). This stays as a backup and for manual runs.
    - cron: "*/10 * * * *"
  workflow_dispatch:           # manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint (also keeps Supabase awake)
        run: |
          # /health runs a real DB query, so each ping also counts as Supabase
          # activity (free-tier projects pause after ~7 idle days).
          # Retry through Render cold starts (30-60s). Only a confirmed 503
          # (DB down) or repeated no-response fails the job — a failed run makes
          # GitHub email the repo owner instead of the outage going unnoticed.
          URL=https://career-scout-pwa.onrender.com/health
          for attempt in 1 2 3; do
            BODY=$(curl -s --max-time 60 -w "\n%{http_code}" "$URL" || echo -e "\n000")
            STATUS=$(echo "$BODY" | tail -n1)
            echo "Attempt $attempt: HTTP $STATUS — $(echo "$BODY" | head -n1)"
            if [ "$STATUS" = "200" ]; then
              echo "Render + DB healthy"
              exit 0
            fi
            if [ "$STATUS" = "503" ]; then
              echo "::error::API is up but the database is DOWN (Supabase paused?). Restore it in the Supabase dashboard."
              exit 1
            fi
            sleep 20
          done
          echo "::error::Render did not respond after 3 attempts."
          exit 1
