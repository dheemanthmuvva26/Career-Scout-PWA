name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:           # manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          # --max-time 35: Render cold start takes 20-30s; old 15s was too short
          # || true: a sleeping/waking Render should never fail the job —
          #          the whole point is to wake it up, not to verify it's awake
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 35 \
            https://career-scout-pwa.onrender.com/health || echo "000")
          echo "Health check returned HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Render is warm"
          else
            echo "Render waking up (status $STATUS — normal on cold start)"
          fi
