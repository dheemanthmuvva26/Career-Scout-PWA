summary_focus: >
  Frame as an MLOps Engineer who bridges ML research and production systems.
  Lead with experience building ML pipelines — from data ingestion and feature
  engineering through model training, evaluation, and deployment — using tools
  like MLflow, DVC, and Docker. Highlight CI/CD automation for model releases,
  monitoring for drift/degradation, and infrastructure-as-code for reproducible
  experiments. Use "MLOps", "model deployment", "ML pipeline", "model monitoring",
  "CI/CD", and "production ML" language throughout. Emphasise reliability,
  experiment tracking, and the engineering rigour that turns notebooks into
  production services.

