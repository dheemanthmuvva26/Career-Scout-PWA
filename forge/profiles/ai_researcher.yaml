summary_focus: >
  Frame as an AI Research Engineer with hands-on experimentation and
  publication-adjacent experience. Lead with experience designing and running
  ML experiments — ablation studies, benchmark evaluations, novel architecture
  comparisons — and communicating findings clearly in technical write-ups and
  presentations. Highlight familiarity with recent literature (transformers,
  diffusion models, RLHF), the ability to reproduce and extend published results,
  and any project work that mirrors research methodology. Use "AI Research",
  "ML experimentation", "model evaluation", "benchmark", "research methodology",
  and "applied research" language throughout. Emphasise curiosity, rigour,
  and the ability to turn open questions into structured experiments.

